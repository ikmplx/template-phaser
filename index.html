<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2D-прототип</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="arena" aria-label="2D-прототип">
    <div id="game" aria-label="Игровая область"></div>
    <div class="hud">
      <div class="counter"><span>Нажатия</span><strong id="counter">0</strong></div>
      <div class="hud-actions">
        <button id="reset" type="button" aria-label="Начать заново" title="Начать заново">↻</button>
        <button id="open-settings" type="button" aria-label="Настройки" title="Настройки" aria-haspopup="dialog" aria-controls="settings-dialog">⚙</button>
      </div>
    </div>
    <dialog id="settings-dialog" aria-labelledby="settings-title" aria-describedby="settings-hint">
      <div class="settings-header">
        <h2 id="settings-title">Настройки</h2>
        <button id="close-settings" type="button" aria-label="Закрыть настройки" autofocus>×</button>
      </div>
      <p id="settings-hint">Игра на паузе. Изменения применяются сразу.</p>
      <div class="parameters">
        <div class="parameter">
          <label for="object-count">Число фигур <output id="object-count-value" for="object-count">4</output></label>
          <input id="object-count" type="range" min="1" max="12" step="1" value="4">
        </div>
        <div class="parameter">
          <label for="object-radius">Размер фигур <output id="object-radius-value" for="object-radius">40</output></label>
          <input id="object-radius" type="range" min="16" max="64" step="2" value="40">
        </div>
        <div class="parameter">
          <label for="pulse-duration">Анимация <output id="pulse-duration-value" for="pulse-duration">140 мс</output></label>
          <input id="pulse-duration" type="range" min="80" max="600" step="20" value="140">
        </div>
      </div>
      <div class="settings-actions">
        <button id="reset-parameters" type="button">Сброс параметров</button>
        <button id="settings-done" class="primary" type="button">Готово</button>
      </div>
      <p id="settings-note" role="status">Параметры сохраняются в браузере</p>
    </dialog>
    <p id="error" role="alert" hidden></p>
    <noscript>Для запуска игры включите JavaScript в браузере.</noscript>
  </main>
  <script>
    window.showGameError = function () {
      const error = document.getElementById('error');
      error.hidden = false;
      error.textContent = 'Не удалось запустить игру или произошла ошибка. Обновите страницу. Если ошибка повторится, попросите Codex проверить проект.';
    };
    window.addEventListener('error', window.showGameError);
    window.addEventListener('unhandledrejection', window.showGameError);
  </script>
  <script src="lib/phaser.min.js" onerror="showGameError()"></script>
  <script src="game.js" onerror="showGameError()"></script>
</body>
</html>
